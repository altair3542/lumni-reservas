services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lumni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-change-me}
      POSTGRES_DB: lumni_app
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - lumni_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumni -d lumni_app"]
      interval: 2s
      timeout: 5s
      retries: 20
  app:
    build: .
    init: true
    environment:
      NODE_ENV: development
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo-change-me}
      PGUSER: lumni
      WEB_ORIGIN: http://localhost:${APP_PORT:-8080}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD:-ClienteDemo2026!}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-AdminDemo2026!}
      SEED_DEMO_BOOKINGS: ${SEED_DEMO_BOOKINGS:-true}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build: .
    init: true
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: development
      PGUSER: lumni
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo-change-me}
      EMAIL_POLL_INTERVAL_MS: ${EMAIL_POLL_INTERVAL_MS:-1000}
      EMAIL_BATCH_SIZE: ${EMAIL_BATCH_SIZE:-20}
      EMAIL_FAILURE_MODE: ${EMAIL_FAILURE_MODE:-none}
      EMAIL_HEALTH_FILE: /tmp/lumni-email-worker-heartbeat
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD:-ClienteDemo2026!}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-AdminDemo2026!}
      SEED_DEMO_BOOKINGS: ${SEED_DEMO_BOOKINGS:-true}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');try{const age=Date.now()-Number(fs.readFileSync('/tmp/lumni-email-worker-heartbeat','utf8'));process.exit(age>=0 && age<Math.max(30000,Number(process.env.EMAIL_POLL_INTERVAL_MS)*3)?0:1)}catch{process.exit(1)}"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 6
volumes:
  lumni_pgdata:
