services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lumni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-change-me}
      POSTGRES_DB: lumni_app
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - lumni_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumni -d lumni_app"]
      interval: 2s
      timeout: 5s
      retries: 20
  app:
    build: .
    init: true
    environment:
      NODE_ENV: development
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo-change-me}
      PGUSER: lumni
      WEB_ORIGIN: http://localhost:${APP_PORT:-8080}
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD:-ClienteDemo2026!}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-AdminDemo2026!}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  lumni_pgdata:
