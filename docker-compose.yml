services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lumni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env}
      POSTGRES_DB: lumni_app
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - lumni_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumni -d lumni_app"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  lumni_pgdata:
