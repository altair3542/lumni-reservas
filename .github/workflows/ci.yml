name: Verify A0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', '24', '26']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumni
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: lumni_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lumni -d lumni_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lumni:ci-local-only@127.0.0.1:5432/lumni_test
      TEST_DATABASE_URL: postgresql://lumni:ci-local-only@127.0.0.1:5432/lumni_test
      DEMO_CLIENT_PASSWORD: ClienteDemo2026!
      DEMO_ADMIN_PASSWORD: AdminDemo2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumni/shared build
      - run: pnpm db:setup
      - run: pnpm db:seed
      - run: pnpm verify
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: docker compose up --build -d --wait
      - run: node scripts/smoke-demo.mjs
      - run: docker compose run --rm app pnpm verify
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
